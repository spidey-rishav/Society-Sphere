spring.application.name=backend

# ========== DataSource ==========
spring.datasource.url=jdbc:mysql://localhost:3306/society_sphere?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=MySql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========== Flyway ==========
spring.flyway.enabled=false

# ========== JWT ==========
app.jwt.secret=societySphereSecretKeyForJwtAuthenticationMinimum256BitsLong!
app.jwt.expiration-ms=86400000

# ========== Initial Super Admin ==========
# Set SUPER_ADMIN_PASSWORD in the environment before starting the application.
app.bootstrap.super-admin.email=${SUPER_ADMIN_EMAIL:r4rishavmodi@gmail.com}
app.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.bootstrap.super-admin.reset-password=${SUPER_ADMIN_RESET_PASSWORD:false}

# ========== Mail (SMTP) ==========
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.enabled=${APP_MAIL_ENABLED:false}

# ========== App Base URL ==========
app.base-url=http://localhost:5173

# ========== OpenAPI / Swagger ==========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html